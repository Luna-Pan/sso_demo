# 服务器端手动部署用（配合宿主机 nginx，见同目录 nginx.conf）
# 用法：cd deploy && cp .env.example .env（填好镜像地址/域名/密钥）&& docker compose up -d
# 镜像来自 GHCR：ghcr.io/<仓库所有者>/reely-idp 与 reely-bff（由 GitHub Actions 构建）

name: reely-sso

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-reely}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?请在 .env 中设置 PG_PASSWORD}
      POSTGRES_DB: ${PG_DATABASE:-reely_idp}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  idp:
    image: ${IMAGE_IDP:?请在 .env 中设置 IMAGE_IDP}
    restart: unless-stopped
    env_file: .env
    environment:
      # 容器网络内部连线，与 .env 中的对外域名互不影响
      IDP_INTERNAL_BASE: http://idp:4000
      REDIS_URL: redis://redis:6379
      PG_HOST: postgres
      PG_PORT: '5432'
      # IdP 服务器回调 BFF 用（backchannel logout 等），指向 BFF 容器名
      BFF_MIND_INTERNAL: http://bff-mind:4001
      BFF_NEXUS_INTERNAL: http://bff-nexus:4002
      BFF_TRAIN_INTERNAL: http://bff-train:4003
    ports:
      # 只发布到宿主机回环地址，供宿主机 nginx 反代；不暴露公网
      - '127.0.0.1:4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  bff-mind:
    image: ${IMAGE_BFF:?请在 .env 中设置 IMAGE_BFF}
    restart: unless-stopped
    command: ['npx', 'tsx', 'src/index.ts', '--site=mind']
    env_file: .env
    environment:
      IDP_INTERNAL_BASE: http://idp:4000
      REDIS_URL: redis://redis:6379
    ports:
      - '127.0.0.1:4001:4001'
    depends_on:
      idp:
        condition: service_started
      redis:
        condition: service_healthy

  bff-nexus:
    image: ${IMAGE_BFF:?请在 .env 中设置 IMAGE_BFF}
    restart: unless-stopped
    command: ['npx', 'tsx', 'src/index.ts', '--site=nexus']
    env_file: .env
    environment:
      IDP_INTERNAL_BASE: http://idp:4000
      REDIS_URL: redis://redis:6379
    ports:
      - '127.0.0.1:4002:4002'
    depends_on:
      idp:
        condition: service_started
      redis:
        condition: service_healthy

  bff-train:
    image: ${IMAGE_BFF:?请在 .env 中设置 IMAGE_BFF}
    restart: unless-stopped
    command: ['npx', 'tsx', 'src/index.ts', '--site=train']
    env_file: .env
    environment:
      IDP_INTERNAL_BASE: http://idp:4000
      REDIS_URL: redis://redis:6379
    ports:
      - '127.0.0.1:4003:4003'
    depends_on:
      idp:
        condition: service_started
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:

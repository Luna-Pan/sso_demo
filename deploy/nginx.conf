# Reely SSO 生产环境反向代理
# 部署时把 example.com 全局替换为你的实际域名
#
# 四个 origin 与 OIDC 配置一一对应（.env）：
#   IDP_ISSUER      = https://sso.example.com/auth
#   SITE_*_ORIGIN   = https://{mind,nexus,train}.example.com

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 5m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # 各站点 BFF 通用转发头
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ============================================================
    # IdP：sso.example.com  —— OIDC 协议端点 + Mock 联邦登录页
    # ============================================================
    server {
        listen 80;
        server_name sso.example.com;

        # /auth/* 原样透传（issuer = https://sso.example.com/auth）
        location /auth/ {
            proxy_pass http://idp:4000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Mock VSO / Mock 微信登录页面（.env 中 VSO_MOCK_ORIGIN、
        # WECHAT_MOCK_ORIGIN 指向本域名；对接真实网关后可删）
        location /mock-vso/ {
            proxy_pass http://idp:4000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /mock/ {
            proxy_pass http://idp:4000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /sns/ {
            proxy_pass http://idp:4000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = / { return 404; }
    }

    # ============================================================
    # 业务站点：静态 SPA + 同源 BFF 接口
    # 转发前缀与 Vite dev server 代理清单保持一致
    # ============================================================

    # —— ReelyMind ——
    server {
        listen 80;
        server_name mind.example.com;
        root /var/www/mind;
        index index.html;

        location /auth/      { proxy_pass http://bff-mind:4001;  include /etc/nginx/proxy_common.conf; }
        location /idp-api/   { proxy_pass http://bff-mind:4001;  include /etc/nginx/proxy_common.conf; }
        location /account/   { proxy_pass http://bff-mind:4001;  include /etc/nginx/proxy_common.conf; }
        location /login/start { proxy_pass http://bff-mind:4001; include /etc/nginx/proxy_common.conf; }
        location /dashboard  { proxy_pass http://bff-mind:4001;  include /etc/nginx/proxy_common.conf; }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # —— ReelyNexus ——
    server {
        listen 80;
        server_name nexus.example.com;
        root /var/www/nexus;
        index index.html;

        location /auth/      { proxy_pass http://bff-nexus:4002;  include /etc/nginx/proxy_common.conf; }
        location /idp-api/   { proxy_pass http://bff-nexus:4002;  include /etc/nginx/proxy_common.conf; }
        location /account/   { proxy_pass http://bff-nexus:4002;  include /etc/nginx/proxy_common.conf; }
        location /login/start { proxy_pass http://bff-nexus:4002; include /etc/nginx/proxy_common.conf; }
        location /dashboard  { proxy_pass http://bff-nexus:4002;  include /etc/nginx/proxy_common.conf; }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # —— ReelyTrain ——
    server {
        listen 80;
        server_name train.example.com;
        root /var/www/train;
        index index.html;

        location /auth/      { proxy_pass http://bff-train:4003;  include /etc/nginx/proxy_common.conf; }
        location /idp-api/   { proxy_pass http://bff-train:4003;  include /etc/nginx/proxy_common.conf; }
        location /account/   { proxy_pass http://bff-train:4003;  include /etc/nginx/proxy_common.conf; }
        location /login/start { proxy_pass http://bff-train:4003; include /etc/nginx/proxy_common.conf; }
        location /dashboard  { proxy_pass http://bff-train:4003;  include /etc/nginx/proxy_common.conf; }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}

# Reely SSO —— 宿主机 nginx 站点配置片段
# 安装方法：
#   1. 把 example.com 全局替换为你的实际域名
#   2. cp nginx.conf /etc/nginx/conf.d/reely.conf   (Debian/Ubuntu)
#      或 cp nginx.conf /etc/nginx/conf.d/reely.conf (RHEL/CentOS/Alibaba 等)
#   3. nginx -t && systemctl reload nginx
#
# 四个 origin 与 OIDC 配置一一对应（.env）：
#   IDP_ISSUER    = https://sso.example.com/auth
#   SITE_*_ORIGIN = https://{mind,nexus,train}.example.com

# ============================================================
# IdP：sso 子域名 —— OIDC 协议端点 + Mock 联邦登录页
# ============================================================
server {
    listen 80;
    server_name sso.example.com;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # /auth/* 原样透传（issuer = https://sso.example.com/auth）
    location /auth/     { proxy_pass http://127.0.0.1:4000; }

    # Mock VSO / Mock 微信登录页（.env 中 VSO_MOCK_ORIGIN、
    # WECHAT_MOCK_ORIGIN 指向本域名；对接真实网关后可删）
    location /mock-vso/ { proxy_pass http://127.0.0.1:4000; }
    location /mock/     { proxy_pass http://127.0.0.1:4000; }
    location /sns/      { proxy_pass http://127.0.0.1:4000; }

    location = / { return 404; }
}

# ============================================================
# 业务站点：静态 SPA + 同源 BFF 接口（转发前缀与 Vite dev 代理一致）
# 静态文件目录：deploy/web/{mind,nexus,train}（Actions artifact 解压得到）
# ============================================================

# —— ReelyMind ——
server {
    listen 80;
    server_name mind.example.com;
    root /opt/reely/deploy/web/mind;
    index index.html;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    location /auth/       { proxy_pass http://127.0.0.1:4001; }
    location /idp-api/    { proxy_pass http://127.0.0.1:4001; }
    location /account/    { proxy_pass http://127.0.0.1:4001; }
    location /login/start { proxy_pass http://127.0.0.1:4001; }
    location /dashboard   { proxy_pass http://127.0.0.1:4001; }

    # SPA history 路由回退
    location / { try_files $uri $uri/ /index.html; }
}

